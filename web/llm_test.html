<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLM 测试 · Hub</title><link rel="stylesheet" href="/admin/assets/common.css"><style>.card{margin-bottom:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}pre{white-space:pre-wrap;overflow-wrap:anywhere}textarea{min-height:110px} @media(max-width:700px){.form-grid{grid-template-columns:1fr}}.test-model-section{border:1px solid #e1e8f0;border-radius:12px;padding:18px;margin:0}.test-model-section p{font-size:13px;color:#718096}.test-model-section h3{font-size:13px;margin:16px 0 10px}.test-model-choices{display:flex;flex-wrap:wrap;gap:10px}.test-model-option{display:flex;align-items:center;gap:8px;border:1px solid #dce5f0;border-radius:8px;padding:12px;font-size:13px;cursor:pointer}.test-model-option input{width:auto;accent-color:#2468c7}.test-model-option:has(input:checked){background:#eff6ff;border-color:#8db4e8}</style></head><body><div class="shell"><aside class="side"><div class="brand"><span>AGENT RUNTIME CONTROL</span><b>Agent Runtime Hub</b></div><!-- admin-navigation --></aside><main class="content"><header class="page-head"><div><h1>LLM 测试</h1><p>使用已创建的 LLM Key，验证授权模型与 hub-chat 路由。</p></div><a href="/admin/llm">返回中转站</a></header><section class="card"><div class="form-grid"><label>用户<select id="testUser"><option value="">请选择用户</option></select></label><label>Hub Key<select id="testHubKey"></select></label></div><p id="identityStatus" role="status"></p><p id="routeInfo"></p><label>LLM API Key（自动获取）<input id="resolvedKey" type="password" readonly autocomplete="off" placeholder="选择 Hub Key 后自动获取"></label><button id="reloadKey" type="button">重新获取</button> <a href="/admin/llm" id="createKeyLink" hidden>前往中转站创建 LLM Key</a></section><section class="card"><form id="testForm" class="form-grid"><fieldset class="wide test-model-section"><legend>选择测试模型</legend><p>可以测试 hub-chat 默认路由，也可以直接调用已授权的对外模型。</p><h3>默认路由</h3><div id="testAliasChoices"></div><h3>直接调用对外模型</h3><div id="testDirectChoices" class="test-model-choices"></div><select id="testModel" hidden></select></fieldset><label>请求地址<input readonly value="/llm/v1/chat/completions"></label><label class="wide">测试消息<textarea id="testPrompt" required>请只回复：ok</textarea></label><div class="wide"><button id="sendTest" disabled type="submit">开始测试</button> <button id="cancelTest" type="button" disabled>停止</button></div></form><p>请求发送到当前 Hub，会产生正常的上游模型用量。密钥不保存在浏览器存储中。</p><p id="testStatus" role="status"></p><h3>模型回复</h3><pre id="answer">等待测试</pre><details><summary>原始响应与用量</summary><pre id="rawResponse"></pre></details></section></main></div><script src="/admin/assets/common.js"></script><script src="/admin/assets/llm-test.js"></script></body></html>
