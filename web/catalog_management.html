<style>
[hidden] { display: none !important; }
.catalog-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;align-items:start}.catalog-list{display:grid;gap:8px;margin-top:20px}.catalog-list button{text-align:left;background:#f5f7fb;color:#26364b;border:1px solid transparent;padding:14px;white-space:normal}.catalog-list button[aria-pressed=true]{background:#edf4ff;border-color:#a9c4ff}.catalog-list small{display:block;color:#718198;margin-top:6px}.catalog-form{display:grid;gap:18px}.catalog-form label{display:grid;gap:8px}.catalog-form .check{display:flex;align-items:center}.catalog-form .check input{width:auto}.catalog-form fieldset{border:1px solid #e2e8f0;border-radius:12px;padding:20px;display:grid;gap:16px}.catalog-form legend{padding:0 8px;font-weight:600}.catalog-form textarea{min-height:80px;resize:vertical}.catalog-form input,.catalog-form textarea{width:100%;box-sizing:border-box}.catalog-form [hidden]{display:none}.catalog-form .actions{position:sticky;bottom:0;background:white;padding:16px 0;border-top:1px solid #e2e8f0}#preview{padding:24px;background:#f5f7fb;border-radius:12px}#preview h3{margin:0 0 12px}#preview p{white-space:pre-wrap}.channel-links{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px}@media(max-width:800px){.catalog-layout{grid-template-columns:1fr}}

.web-cap-section h3{display:none}.detail-view .web-cap-section h3{display:block}.detail-view [data-copy-locale]{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px;align-items:start}.detail-view .web-render-card{padding:0;border:0;background:transparent;box-shadow:none;width:100%;min-width:0}.detail-view .web-detail-copy{border:1px solid #dfe5f0;background:white;border-radius:14px;padding:20px;margin-top:20px}.web-acquire-preview{min-width:0;background:white;border:1px solid #dfe5f0;border-radius:16px;padding:20px}.web-acquire-preview h2{font-size:20px;margin:0 0 20px}.web-consent-preview{padding:12px;background:#f4f6fb;border-radius:10px;font-size:13px}.web-acquire-preview .preview-agree{display:flex;align-items:start;gap:8px;font-size:12px;line-height:1.7;margin:16px 0}.preview-agree input{width:16px!important;flex:none}.web-acquire-preview button{width:100%;margin:12px 0 0;opacity:1;background:#365cff;color:white;border:0;font-size:13px}.web-acquire-preview [data-preview-invite]{border-top:1px solid #dfe5f0;padding-top:18px;margin-top:18px}.web-acquire-preview [data-preview-invite] label{font-size:13px}.web-acquire-preview input:disabled{background:white;min-height:38px}.web-acquire-preview .preview-agree input{min-height:0}.web-acquire-preview .note{font-size:11px;line-height:1.6}.web-acquire-preview .web-inline-consentText{font-size:12px}.detail-view .web-cap-section{border-top:1px solid #e5eaf3;margin-top:20px;padding-top:4px}
@media(max-width:1200px){.detail-view [data-copy-locale]{grid-template-columns:1fr}.web-acquire-preview{width:100%;box-sizing:border-box}}
.web-legal-links{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px}.web-legal-links a{color:#365cff;text-decoration:underline;text-underline-offset:3px}

<body><div class="shell"><aside class="side"><div class="brand"><span>AGENT RUNTIME CONTROL</span><b>Agent Runtime Hub</b></div><!-- admin-navigation --></aside>

<div class="catalog-layout"><section class="card"><div class="actions"><button id="new" type="button">新增助手</button><button id="refresh" type="button" class="secondary">刷新列表</button></div><p id="list-status" role="status"></p><div class="catalog-list" id="list"></div></section>
