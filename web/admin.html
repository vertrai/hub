<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gateway 控制台</title><link rel="stylesheet" href="/admin/assets/common.css"></head><body><div class="shell">
<aside class="side"><div class="brand"><span>AGENT RUNTIME CONTROL</span><b>Agent Runtime Hub</b></div><!-- admin-navigation --></aside>
<main class="content"><header class="page-head"><div><div class="eyebrow">Manager control plane</div><h1>管理总览</h1><p>查看用户和资源可用情况，进入对应工作台进行管理。</p></div><form action="/v1/admin/logout" method="post"><button class="secondary" type="submit">退出登录</button></form></header>
<section class="grid"><article class="card metric"><p>Gateway 用户</p><strong id="userCount">—</strong><a href="/admin/users">管理用户与 Key →</a></article><article class="card metric"><p>可用 Google 账号</p><strong id="googleAvailable">—</strong><a href="/admin/google">打开 Google 资源池 →</a></article><article class="card metric"><p>Browser Profiles</p><strong id="browserProfiles">—</strong><a href="/admin/browser">查看 Browser 资源池 →</a></article><article class="card metric"><p>可用 Telegram Bot</p><strong id="telegramAvailable">—</strong><a href="/admin/telegram">打开 Telegram 工作台 →</a></article><article class="card metric"><p>已授权 Telegram 生产账号</p><strong id="telegramAccounts">—</strong><a href="/admin/telegram">连接生产账号 →</a></article><article class="card wide"><div class="toolbar"><button id="refresh">刷新资源状态</button><span id="status" class="status"></span></div></article></section>
</main></div><script src="/admin/assets/common.js"></script><script>
function setMetric(id,value){const node=$(id),card=node.closest('.metric');node.textContent=value;card.style.borderLeftColor=value===0?'#d88918':'';card.style.background=value===0?'#fffaf1':'';node.style.color=value===0?'#a15c00':''}
async function load(){
 setBusy($('refresh'),true,'刷新中…');$('status').textContent='';
 const metrics=[
 ['userCount','/v1/admin/users/options',d=>d.items.length],
 ['googleAvailable','/v1/admin/google/accounts',d=>d.items.filter(x=>x.status==='available').length],
 ['browserProfiles','/v1/admin/browser/sessions',d=>d.items.length],
 ['telegramAvailable','/v1/admin/telegram/bots',d=>d.items.filter(x=>x.status==='available').length],
 ['telegramAccounts','/v1/admin/telegram/auth/accounts',d=>d.items.filter(x=>x.status==='authorized').length]
 ];
 const results=await Promise.allSettled(metrics.map(async([id,path,count])=>{
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);
  try{const data=await adminRequest(path,{signal:controller.signal});setMetric(id,count(data));$(id).removeAttribute('title');}
  catch(err){$(id).textContent='暂不可用';$(id).title=err.message;throw err;}
  finally{clearTimeout(timeout);}
 }));
 const failed=results.filter(r=>r.status==='rejected').length;
 showStatus($('status'),failed?failed+' 项加载失败，可以点击刷新重试。':'资源状态已更新',!failed);
 setBusy($('refresh'),false);
}$('refresh').onclick=load;load();
</script></body></html>
