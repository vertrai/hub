<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google 资源</title><link rel="stylesheet" href="/admin/assets/common.css"></head><body><div class="shell">
<aside class="side"><div class="brand"><span>AGENT RUNTIME CONTROL</span><b>Agent Runtime Hub</b></div><nav class="nav"><small>MANAGER</small><a href="/admin">管理总览</a><a href="/admin/users">用户与密钥</a><a href="/admin/hymatrix">Hymatrix Pods</a><div class="divider"></div><small>RESOURCES</small><a class="active" href="/admin/google">Google 资源池</a><a href="/admin/browser">Browser 资源池</a><a href="/admin/xbot">Xbox Bot 资源池</a><a href="/admin/telegram">Telegram 资源池</a><a href="/admin/weixin">Weixin 扫码测试</a><a href="/admin/test">资源 API 测试</a></nav></aside>
<main class="content"><header class="page-head"><div><div class="eyebrow">Workspace account pool</div><h1>Google 资源</h1><p>生产 Workspace 账号并观察账号池分配状态。</p></div></header><section class="grid"><article class="card"><h2>批量生产账号</h2><form id="form" class="grid"><label>数量<input id="count" type="number" min="1" max="100" value="5"></label><label>Domain<input id="domain" value="vertr.ai"></label><div class="wide actions"><button id="create">开始生产</button><span id="status" class="status"></span></div></form><pre id="result" class="result"></pre></article><article class="card metric"><p>当前可分配</p><strong id="available">—</strong><p>每个 Gateway API Key 最多领取一个账号。</p></article><article class="card wide"><div class="page-head"><div><h2>账号池</h2><p>密码只通过用户资源接口返回，不在管理列表重复展示。</p></div><button id="refresh" class="secondary">刷新</button></div><div id="accounts" class="table-wrap"></div></article></section>
</main></div><script src="/admin/assets/common.js"></script><script>
async function designateXbox(id){if(!confirm('把这个未使用的普通 Google User 设置为 Xbox 类型？设置后需人工注册 Xbox 并标记可用。'))return;await adminRequest('/v1/admin/xbox/bots',{method:'POST',body:JSON.stringify({googleUserId:id})});await load()}
async function markXboxReady(id){if(!confirm('确认已经完成 Xbox 账号注册并允许 Agent 领取？'))return;await adminRequest(`/v1/admin/xbox/bots/${encodeURIComponent(id)}/ready`,{method:'PATCH',body:'{}'});await load()}
async function load(){try{const d=await adminRequest('/v1/admin/google/accounts');$('available').textContent=d.items.filter(x=>x.status==='available'&&!x.purpose).length;$('accounts').innerHTML=`<table><thead><tr><th>Email</th><th>类型</th><th>Xbox 设置状态</th><th>分配状态</th><th>绑定 Key</th><th>Google User ID</th><th>操作</th></tr></thead><tbody>${d.items.map(a=>`<tr><td>${esc(a.email)}</td><td>${pill(a.purpose||'普通')}</td><td>${a.purpose==='xbox'?pill(a.xboxStatus||'waiting_setup'):'—'}</td><td>${pill(a.status)}</td><td>${esc(a.assignedAccessKeyId||'—')}</td><td>${esc(a.googleUserId||'—')}</td><td>${a.status==='available'&&!a.purpose?`<button data-xbox="${esc(a.id)}">设为 Xbox 类型</button>`:a.status==='available'&&a.purpose==='xbox'&&a.xboxStatus==='waiting_setup'?`<button data-ready="${esc(a.id)}">Xbox 已注册，标记可用</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">账号池为空</td></tr>'}</tbody></table>`;document.querySelectorAll('[data-xbox]').forEach(b=>b.onclick=()=>designateXbox(b.dataset.xbox));document.querySelectorAll('[data-ready]').forEach(b=>b.onclick=()=>markXboxReady(b.dataset.ready))}catch(e){$('accounts').innerHTML=`<div class="empty error">${esc(e.message)}</div>`}}$('refresh').onclick=load;$('form').onsubmit=async e=>{e.preventDefault();if(!confirm(`创建 ${$('count').value} 个真实 Workspace 账号？`))return;setBusy($('create'),true,'生产中…');try{const d=await adminRequest('/v1/admin/google/accounts/batch',{method:'POST',body:JSON.stringify({count:Number($('count').value),domain:$('domain').value.trim()})});$('result').textContent=JSON.stringify(d.created,null,2);$('result').style.display='block';showStatus($('status'),`已创建 ${d.createdCount} 个账号`,true);load()}catch(x){showStatus($('status'),x.message)}finally{setBusy($('create'),false)}};
load();
</script></body></html>
