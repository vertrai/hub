<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邀请码与订阅 · Hub</title><link rel="stylesheet" href="/admin/assets/common.css"></head><body><div class="shell"><aside class="side"><div class="brand">Hub Manager</div><nav class="nav"></nav></aside><main class="content"><div class="page-head"><div><h1>邀请码与订阅</h1><p>管理用户开通资格，查看订阅与助手部署进度。</p></div><button id="refresh">刷新</button></div><p id="notice" role="status"></p>
<section class="card" style="margin-bottom:20px"><h2>创建邀请码</h2><form id="create" class="grid"><label>数量（1–100）<input id="count" type="number" min="1" max="100" value="1" required></label><label>产品标识（留空通用）<input id="product" placeholder="telegram_customer_agent"></label><label>到期时间（选填）<input id="expiry" type="datetime-local"></label><label>备注<input id="note" maxlength="500"></label><button type="submit">创建邀请码</button></form></section>
<section class="card" style="margin-bottom:20px"><h2>邀请码</h2><p>显示最近 1,000 条。已兑换的邀请码保留兑换记录。</p><div style="overflow:auto"><table><thead><tr><th>邀请码</th><th>产品</th><th>备注</th><th>到期</th><th>兑换用户</th><th>状态</th><th>操作</th></tr></thead><tbody id="codes"></tbody></table></div></section>
<section class="card" style="margin-bottom:20px"><h2>订阅账单</h2><div style="overflow:auto"><table><thead><tr><th>订单</th><th>产品</th><th>状态</th><th>订阅</th><th>助手</th><th>周期结束</th></tr></thead><tbody id="billing"></tbody></table></div></section>
<section class="card" style="margin-bottom:20px"><h2>Web 助手开通任务</h2><p>失败任务可以重试；结果待核对的任务请先检查节点与资源分配，避免重复创建。</p><div style="overflow:auto"><table><thead><tr><th>助手</th><th>用户</th><th>产品</th><th>状态</th><th>阶段</th><th>错误</th><th>操作</th></tr></thead><tbody id="agents"></tbody></table></div></section>
</main></div><script src="/admin/assets/common.js"></script><script src="/admin/assets/commerce.js"></script></body></html>
