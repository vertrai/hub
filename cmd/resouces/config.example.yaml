env: dev
port: :8085
ginMode: debug

postgres:
  dsn: postgresql://postgres@127.0.0.1:5432/hub_local?sslmode=disable
admin:
  apiKey: replace-with-a-random-admin-api-key

browser:
  apiKey: replace-with-browser-use-api-key
  apiBaseURL: https://api.browser-use.com/api/v3
  timeoutMinutes: 240
  proxyCountryCode: sg
  statusCheckInterval: 30s

google:
  creation:
    credentialsFile: ./google-creation-service-account.json
    adminEmail: workspace-admin@example.com
    domain: example.com
  authorization:
    credentialsFile: ./google-authorization-service-account.json
    domain: example.com
    scopes:
      - https://mail.google.com/
      - https://www.googleapis.com/auth/drive
      - https://www.googleapis.com/auth/spreadsheets
      - https://www.googleapis.com/auth/calendar
      - https://www.googleapis.com/auth/documents

telegram:
  # MTProto login sessions are stored here; keep this directory private and persistent.
  dataDir: ./data/telegram
  minAvailableBots: 2
  botName: Vertr Agent
  botUsernamePrefix: vertr_agent
  requestTimeout: 30s
