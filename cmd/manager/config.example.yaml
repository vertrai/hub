env: local
port: ":8086"
ginMode: debug

postgres:
  dsn: postgresql://postgres@127.0.0.1:5432/hub_manager?sslmode=disable
auth:
  google:
    clientId: 6413958546-eo8gja7e3erq219e7vj8vqrgrjum0hl9.apps.googleusercontent.com
    allowedEmails:
      - sandy@ever.vision
  jwt:
    issuer: hub-auth
    # 相对于本配置文件解析。共享私钥表示 manager 与 platformServer 属于同一签名信任域。
    privateKeyFile: ../../../agent-hub/cmd/platformServer/data/auth_private.pem
    publicKeyFile: ../../../agent-hub/cmd/platformServer/data/auth_public.pem
    accessTokenTTLMinutes: 600
    audience: manager
    cookieSecure: false # 生产 HTTPS 环境请设为 true
resources:
  baseURL: http://127.0.0.1:8085
  adminAPIKey: must-match-resouces-admin-api-key
  timeout: 30s

# 小程序一键创建 Hermes Agent。所有敏感配置只保存在 manager 服务端。
miniProgram:
  appId: ""
  appSecret: ""
  weixinAPIBase: https://api.weixin.qq.com
  pod:
    nodeURL: https://your-hymatrix-node.example
    adminURL: http://your-hymatrix-node.example:9091
    privateKey: ""
    # 助手模块统一在 Manager 的“助手管理”中设置。
    runtimeType: hermes
  agent:
    gatewayURL: https://your-manager.example
    hermesGatewayToken: ""
    # LLM 配置通过此 Agent 的 Hub API Key 自动申请，在 /admin/llm 设置默认模型。

# vertr.ai 兼容 API。产品标识保持前端协议，catalogId 指向后台助手目录。
# 对应模块须实现 Hub Hermes 的 Start-Agent 协议。
commerce:
  nodeURL: ""
  adminURL: "" # 节点需支持 /admin/vms/stop 和 /admin/vms/resume
  privateKey: ""
  gatewayURL: ""
  hermesGatewayToken: ""
  products:
    telegram_customer_agent:
      catalogId: ""
      priceId: ""
    x_agent:
      catalogId: ""
      priceId: ""
stripe:
  enabled: false
  secretKey: ""
  webhookSecret: ""
  successURL: https://vertr.ai/checkout-success.html?session_id={CHECKOUT_SESSION_ID}
  cancelURL: https://vertr.ai/marketplace.html
  portalReturnURL: https://vertr.ai/my-agents.html
  managedPayments: false
  requireTermsOfServiceConsent: true
  stopAgentOnPaymentFailure: true
