[dockerfile]
FROM = "sandytest456/hermes-agent:linux-full"
bin = "bin"
RUN = [
  "python -m pip install --no-cache-dir 'python-telegram-bot==22.6' 'aiohttp==3.13.3' && python -c 'import telegram; import telegram.ext; import aiohttp'",
]

[vmdocker]
public = [
  "~/.hermes/skills/*",
  "~/.hermes/state.db*",
  "~/.harness/browser-harness/*",
  "~/.local/share/uv/tools/browser-harness/*",
]
